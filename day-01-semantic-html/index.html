        <form method="post">

            name="name"
            placeholder="Enter your name "
            required
          />
          <label for="email">Email</label>

            type="email"
            name="email"
            id="email"
            placeholder="Enter your email "
            required
          />
          <label for="message">Message : </label>
          <textarea
            id="message"
            name="message"
            placeholder="Enter your message "
            rows="4"
            maxlength="500"
            required
          ></textarea>
          <br />
          <button type="submit" name="Submit"></button>
        </form>
